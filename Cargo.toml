[package]
name = "umbra-relay"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Private, encrypted relay server for the Umbra secure messenger (group relay + mailbox)."

# Standalone project (own workspace root). Depends on the messenger's shared
# crypto/protocol core by path.
[workspace]

[[bin]]
name = "umbra-relay"
path = "src/main.rs"

[dependencies]
# Clone the app repo alongside this one (default dir name "Umbra"). On Linux
# paths are case-sensitive, so this must match the cloned directory exactly.
unichat-core = { path = "../Umbra/unichat-common/core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rpassword = "7"
ctrlc = "3"
zeroize = { version = "1.9", features = ["derive"] }
